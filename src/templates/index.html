<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Kostenlose Wettervorhersage mit Niederschlagsradar">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" href="/static/icons/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.svg">
  <title>Wetter</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">

  <link rel="stylesheet" href="/static/app.css?v={{ version }}">
</head>
<body>

<div class="app">

  <!-- Header -->
  <header class="header">
    <div class="search-wrap">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      <input class="search-input" id="search" type="search" placeholder="Stadt suchen..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button class="geo-btn" id="geo-btn" type="button" aria-label="Mein Standort">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>
        </svg>
      </button>
      <button class="search-clear" id="search-clear" type="button" aria-label="Suche leeren">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      <div class="search-results" id="search-results"></div>
    </div>
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="weather">Wetter</button>
      <button class="tab-btn" data-tab="radar">Regenradar</button>
    </div>
  </header>

  <!-- Content -->
  <div class="content">

    <!-- ═══ Weather Tab ═══ -->
    <div class="tab-panel active" id="panel-weather">

      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Wetterdaten werden geladen...</p>
      </div>

      <div class="placeholder" id="placeholder">
        <div class="placeholder-icon">&#9925;</div>
        <p>Suche nach einer Stadt</p>
      </div>

      <div id="weather-content" style="display:none">
        <div class="warnings-wrap" id="warnings-wrap"></div>

        <div class="current-card" id="current-card">
          <div class="current-card-bg" id="current-card-bg"></div>
          <div class="current-card-overlay"></div>
          <div class="current-icon" id="current-icon"></div>
          <div class="current-hero">
            <div class="current-hero-pill">
              <div class="current-location" id="current-location"></div>
              <div class="current-date" id="current-date"></div>
              <div class="current-source" id="current-source" style="display:none"></div>
            </div>
            <div class="current-details" id="current-details"></div>
          </div>
          <div class="image-attribution" id="image-attribution" style="display:none"></div>
        </div>

        <div class="section-label fade-in fade-in-delay-1">Heute stundenweise</div>
        <div class="hourly-card fade-in fade-in-delay-1">
          <div class="hourly-outer" id="hourly-outer"></div>
        </div>

        <div class="aqi-card fade-in fade-in-delay-1" id="aqi-card" style="display:none"></div>

        <div class="section-label fade-in fade-in-delay-2">14-Tage-Vorhersage</div>
        <div class="temp-chart-card fade-in fade-in-delay-2" id="temp-chart-card">
          <div class="temp-chart-scroll" id="temp-chart-scroll"></div>
          <div class="temp-chart-legend">
            <div class="legend-item"><div class="legend-dot" style="background:#f59e0b"></div> Max &deg;C</div>
            <div class="legend-item"><div class="legend-dot" style="background:#60a5fa"></div> Min &deg;C</div>
            <div class="legend-item">&#9728;&#65039; Sonne</div>
            <div class="legend-item">&#128167; Regen</div>
          </div>
        </div>
        <div class="daily-card fade-in fade-in-delay-2" id="daily-card"></div>

        <div class="section-label fade-in fade-in-delay-2" id="pollen-section" style="display:none">Pollenflug</div>
        <div class="pollen-card fade-in fade-in-delay-2" id="pollen-card" style="display:none"></div>
      </div>

    </div>

    <!-- ═══ Radar Tab ═══ -->
    <div class="tab-panel" id="panel-radar">
      <div class="section-label">Niederschlagsradar Deutschland</div>
      <div class="radar-container">
        <div id="radar-map"></div>
        <div class="radar-controls">
          <div class="radar-time-display">
            <div class="radar-label" id="radar-label">Niederschlag</div>
            <div id="radar-time">--:--</div>
          </div>
          <div class="radar-slider-row">
            <button class="radar-play-btn" id="radar-play-btn" aria-label="Abspielen">
              <svg id="play-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,3 20,12 6,21"/></svg>
              <svg id="pause-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg>
            </button>
            <input type="range" class="radar-slider" id="radar-slider" min="0" max="0" value="0">
          </div>
          <div class="radar-legend">
            <span>leicht</span>
            <div class="radar-legend-bar"></div>
            <span>stark</span>
          </div>
        </div>
      </div>
    </div>

  </div>

  <div class="footer">
    Daten: <a href="https://brightsky.dev/" target="_blank" rel="noopener">Bright Sky</a> / <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> (DWD) &middot;
    Radar: <a href="https://www.rainviewer.com/" target="_blank" rel="noopener">RainViewer</a> &middot;
    v{{ version }}
  </div>

</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>

<script>window.__API_KEY = {{ api_key | tojson }};</script>
<script src="/static/app.js?v={{ version }}"></script>

</body>
</html>
