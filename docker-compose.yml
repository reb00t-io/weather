services:
  weather:
    image: weather
    container_name: weather
    restart: unless-stopped
    environment:
      - PORT=${PORT}
      - API_KEY=${API_KEY}
      - UNSPLASH_ACCESS_KEY=${UNSPLASH_ACCESS_KEY:-}
      - FAL_KEY=${FAL_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - TICKETMASTER_API_KEY=${TICKETMASTER_API_KEY:-}
    ports:
      - "${PORT}:${PORT}"
    volumes:
      # Survive container rebuilds so we don't regenerate AI images
      # or re-fetch Unsplash/Wikipedia photos on every deploy.
      - weather_ai_images:/app/src/static/ai_images
      - weather_cache:/home/appuser/.cache/weather

volumes:
  weather_ai_images:
  weather_cache:
